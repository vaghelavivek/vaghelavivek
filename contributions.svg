<svg xmlns="http://www.w3.org/2000/svg" width="840" height="196" viewBox="0 0 840 196" role="img" aria-label="GitHub contribution stats">
  <title>GitHub contribution stats</title>
  <defs>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/></linearGradient>
    <radialGradient id="glow" cx="0.1" cy="0" r="0.9"><stop offset="0" stop-color="#7aa2f7" stop-opacity="0.16"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .title { font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c0caf5; letter-spacing: 2px; }
    .tag { font: 700 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1.5px; }
    .value { font: 800 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: url(#accent); text-anchor: middle; }
    .label { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c0caf5; text-anchor: middle; }
    .sub { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #787c99; text-anchor: middle; }
    .foot { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #787c99; text-anchor: middle; }
  </style>
  <rect width="840" height="196" rx="14" fill="#1a1b27"/>
  <rect width="840" height="196" rx="14" fill="url(#glow)"/>
  <text x="20" y="32" class="title">GITHUB CONTRIBUTIONS</text>
  <circle cx="778" cy="28" r="4" fill="#9ece6a"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="788" y="32" class="tag" fill="#9ece6a">LIVE</text>
  <g>
    <rect x="16" y="52" width="193" height="104" rx="12" fill="#24283b"/>
    <rect x="96.5" y="52" width="32" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="112.5" y="102" class="value">1,609</text>
    <text x="112.5" y="124" class="label">Total contributions</text>
    <text x="112.5" y="142" class="sub">incl. private client work</text>
  </g>
  <g>
    <rect x="221" y="52" width="193" height="104" rx="12" fill="#24283b"/>
    <rect x="301.5" y="52" width="32" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="317.5" y="102" class="value">1,254</text>
    <text x="317.5" y="124" class="label">Contributions in 2026</text>
    <text x="317.5" y="142" class="sub">1,254 in last 365 days</text>
  </g>
  <g>
    <rect x="426" y="52" width="193" height="104" rx="12" fill="#24283b"/>
    <rect x="506.5" y="52" width="32" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="522.5" y="102" class="value">407</text>
    <text x="522.5" y="124" class="label">Best month</text>
    <text x="522.5" y="142" class="sub">Oct 2026</text>
  </g>
  <g>
    <rect x="631" y="52" width="193" height="104" rx="12" fill="#24283b"/>
    <rect x="711.5" y="52" width="32" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="727.5" y="102" class="value">45</text>
    <text x="727.5" y="124" class="label">Best single day</text>
    <text x="727.5" y="142" class="sub">2 Nov 2026</text>
  </g>
  <text x="420" y="182" class="foot">Live from the GitHub API · updated 7 Nov 2026, 16:52 UTC</text>
</svg>
