    .value { font: 800 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: url(#accent); text-anchor: middle; }
    .label { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c0caf5; text-anchor: middle; }
    .sub { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #787c99; text-anchor: middle; }
    .foot { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #787c99; text-anchor: middle; }
  </style>
  <rect width="840" height="280" rx="14" fill="#1a1b27"/>
  <rect width="840" height="280" rx="14" fill="url(#glow)"/>
  <text x="20" y="32" class="title">CAREER HIGHLIGHTS</text>
  
